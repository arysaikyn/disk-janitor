<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 还我磁盘 Giveback — v2 logo: the breathing orb + returning undo ring.
       Identity: docs/redesign-PLAN.md (ink #0A0E14, teal #2DD4BF). -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </radialGradient>
    <radialGradient id="orb" cx="42%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#7CF7E6"/>
      <stop offset="55%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0FA392"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#2DD4BF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>

  <!-- undo ring: contracting pulse, broken where it meets the orb -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#2DD4BF" stroke-opacity="0.5"
          stroke-width="30" stroke-linecap="round"
          stroke-dasharray="1560 325" transform="rotate(-40 512 512)"/>

  <!-- glow -->
  <circle cx="512" cy="512" r="235" fill="url(#glow)"/>

  <!-- the orb -->
  <circle cx="512" cy="512" r="196" fill="url(#orb)"/>

  <!-- highlight: the orb's light source -->
  <ellipse cx="452" cy="440" rx="74" ry="52" fill="#E8FFFB" opacity="0.4" transform="rotate(-18 452 440)"/>
</svg>
